name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install tooling (justfile path)
        if: ${{ hashFiles('justfile') != '' }}
        run: |
          just init

      - name: Install tooling (fallback if no justfile)
        if: ${{ hashFiles('justfile') == '' }}
        run: |
          python -m pip install -U pip
          pip install ruff mypy pytest

      - name: Run quality checks (justfile path)
        if: ${{ hashFiles('justfile') != '' }}
        run: |
          just all

      - name: Run quality checks (fallback if no justfile)
        if: ${{ hashFiles('justfile') == '' }}
        run: |
          ruff format --check .
          ruff check .
          mypy .
          pytest -q